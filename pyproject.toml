[project]
name = "multiagent-notes-api"
version = "0.1.0"
description = "Small Notes API built by a supervisor/builder/reviewer agent team."
requires-python = ">=3.11"
# Dependencies are pinned in requirements-dev.txt. The project is never pip-installed, so each
# git worktree imports its own `app/` from the working directory (see AGENTS.md).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:Warning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
